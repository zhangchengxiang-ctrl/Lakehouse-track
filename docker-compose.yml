# ============================================================
# Lakehouse-track：埋点全链路 + CDC（统一架构）
# 用法：docker compose up -d --build --scale collection=2
#
# 双链路架构：
#   埋点采集：SDK → [Nginx+Vector+MetaSync] x N → S3 (TSV.gz) → StarRocks Pipe
#   CDC 入湖：PostgreSQL → Flink CDC → Paimon → StarRocks Paimon Catalog
#
# CN 弹性伸缩（存算分离，无状态）：
#   扩容：docker compose up -d --scale starrocks-cn=4
#   缩容：docker compose up -d --scale starrocks-cn=1  (SIGTERM 自动从 FE 注销)
#
# 前置准备：
#   1. make install
#   2. docker compose up -d --build
#   3. StarRocks 就绪后：mysql -h 127.0.0.1 -P 9030 -u root < services/starrocks/starrocks.sql
#   4. Flink CDC：make run-sql ARGS=flink
# ============================================================

services:
  # ==================== 基础设施 ====================
  # Postgres：默认库 postgres，业务表在 schema StellarTrace（02/04）；metastore 为独立库仅给 Hive
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]   # CDC 必需
    mem_limit: 512m
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      # 由 PG_* 映射，与 .env 单一数据源一致
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB:-postgres}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    mem_limit: 512m
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - lakehouse-net

  minio-init:
    image: minio/mc
    env_file: .env
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        /usr/bin/mc alias set myminio $${S3_ENDPOINT:-http://minio:9000} $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} && break;
        sleep 2;
      done;
      /usr/bin/mc mb myminio/$${S3_BUCKET:-lakehouse} || true;
      printf '' | /usr/bin/mc pipe myminio/$${S3_BUCKET:-lakehouse}/paimon_data/.keep || true;
      printf '' | /usr/bin/mc pipe myminio/$${S3_BUCKET:-lakehouse}/track/events/.keep || true;
      printf '' | /usr/bin/mc pipe myminio/$${S3_BUCKET:-lakehouse}/track/id_mapping/.keep || true;
      exit 0;
      "
    networks:
      - lakehouse-net

  # ==================== 埋点采集链路 ====================
  # SDK → Collection (Nginx+Vector+MetaSync) x N → S3 → StarRocks

  # 采集节点 (Nginx + Vector + MetaSync)，无状态可水平扩展
  collection:
    build:
      context: .
      dockerfile: services/collection/Dockerfile
    mem_limit: 4g
    ports:
      - "${COLLECTION_PORT:-8080}:80"
    env_file: .env
    environment:
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DB: ${PG_DB:-postgres}
      PG_SCHEMA: ${PG_SCHEMA:-StellarTrace}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-lakehouse}
      S3_REGION: ${S3_REGION:-us-east-1}
      META_API_URL: ${META_API_URL:-http://meta-api:3000/register}
      META_SYNC_INTERVAL: ${META_SYNC_INTERVAL:-30}
      VECTOR_LOG: ${VECTOR_LOG:-info}
      DEPLOY_ENV: ${DEPLOY_ENV:-dev}
    volumes:
      - ./services/collection/config/geoip:/etc/vector/geoip:ro
      - ./services/collection/config/sdk_debug:/etc/nginx/sdk_debug:ro
      # 注：使用 anonymous volumes 让每个 collection 实例拥有独立的 buffer
      # 容器 restart 不丢数据，recreate/rebuild 会重置（生产用 K8s PVC 持久化）
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure
    networks:
      - lakehouse-net

  # 元数据注册 API
  meta-api:
    build:
      context: .
      dockerfile: services/meta-api/Dockerfile
    mem_limit: 256m
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DB: ${PG_DB:-postgres}
      PG_SCHEMA: ${PG_SCHEMA:-StellarTrace}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - lakehouse-net

  # ==================== CDC 链路 (Flink + Paimon) ====================
  # PostgreSQL CDC → Flink → Paimon → StarRocks Paimon Catalog

  flink-jobmanager:
    build:
      context: .
      dockerfile: services/flink/Dockerfile
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    command: jobmanager
    mem_limit: 2g
    env_file: .env
    volumes:
      - ./services/flink/flink.sql:/opt/flink/flink.sql:ro
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      ENABLE_S3_PATH_STYLE_ACCESS: "true"
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      hive-metastore:
        condition: service_started
    networks:
      - lakehouse-net

  flink-taskmanager:
    build:
      context: .
      dockerfile: services/flink/Dockerfile
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    command: taskmanager
    mem_limit: 2g
    env_file: .env
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      ENABLE_S3_PATH_STYLE_ACCESS: "true"
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    depends_on:
      - flink-jobmanager
    networks:
      - lakehouse-net

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    user: "0:0"
    restart: on-failure
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command: "/opt/hive/bin/hms-entrypoint.sh"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HIVE_CONF_hive_metastore_warehouse_dir: s3a://${S3_BUCKET:-lakehouse}/paimon_data/
      HIVE_CONF_hive_metastore_disallow_incompatible_col_type_changes: "false"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://${PG_HOST:-postgres}:${PG_PORT:-5432}/${HMS_DB:-metastore}
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionUserName=${PG_USER:-postgres}
        -Djavax.jdo.option.ConnectionPassword=${PG_PASSWORD:-postgres}
    ports:
      - "9083:9083"
    volumes:
      - ./services/flink/lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
      - ./services/hive/lib/hadoop-aws-3.1.0.jar:/opt/hive/lib/hadoop-aws-3.1.0.jar
      - ./services/hive/lib/aws-java-sdk-bundle-1.11.271.jar:/opt/hive/lib/aws-java-sdk-bundle-1.11.271.jar
      - ./services/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./services/hive/hms-entrypoint.sh:/opt/hive/bin/hms-entrypoint.sh:ro
    networks:
      - lakehouse-net

  # ==================== 分析层 (StarRocks 存算分离) ====================

  starrocks-fe:
    image: starrocks/fe-ubuntu:3.5.12
    container_name: starrocks-fe
    hostname: starrocks-fe
    mem_limit: 4g
    environment:
      - HOST_TYPE=FQDN
      - JAVA_TOOL_OPTIONS=--add-opens=java.base/java.util=ALL-UNNAMED
    command:
      - /bin/bash
      - -c
      - |
        mkdir -p /opt/starrocks/fe/lib/paimon-ext
        if [ -d /opt/starrocks-extra-jars ] && ls /opt/starrocks-extra-jars/*.jar 1>/dev/null 2>&1; then
          ln -sf /opt/starrocks-extra-jars/*.jar /opt/starrocks/fe/lib/paimon-ext/
        fi
        if ! grep -q "BEGIN LAKEHOUSE_TRACK_SHARED_CONF" /opt/starrocks/fe/conf/fe.conf 2>/dev/null; then
          {
            echo ""
            echo "# BEGIN LAKEHOUSE_TRACK_SHARED_CONF"
            cat /opt/starrocks-fe-shared.conf
            echo "# END LAKEHOUSE_TRACK_SHARED_CONF"
          } >> /opt/starrocks/fe/conf/fe.conf
        fi
        /opt/starrocks/fe/bin/start_fe.sh
    ports:
      - "8030:8030"
      - "9020:9020"
      - "9030:9030"
    volumes:
      - ./services/starrocks/config/fe-shared.conf:/opt/starrocks-fe-shared.conf:ro
      - ./services/starrocks/jars:/opt/starrocks-extra-jars:ro
      - ./data/starrocks/fe:/opt/starrocks/fe/meta
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -h127.0.0.1 -P9030 -e 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      minio:
        condition: service_started
    networks:
      - lakehouse-net

  # CN (Compute Node)：无状态计算节点，统一配置，支持弹性伸缩
  # 扩容：docker compose up -d --scale starrocks-cn=4
  # 缩容：docker compose up -d --scale starrocks-cn=1 (SIGTERM 自动注销)
  # 工作负载隔离由 Resource Group + exclusive_cpu_cores 实现（见 starrocks.sql）
  starrocks-cn:
    image: starrocks/cn-ubuntu:3.5.12
    mem_limit: 4g
    deploy:
      replicas: 2
    environment:
      - HOST_TYPE=FQDN
      - JAVA_TOOL_OPTIONS=--add-opens=java.base/java.util=ALL-UNNAMED
    command:
      - /bin/bash
      - -c
      - |
        CN_HOST=$$(hostname -f)
        if [ -f /opt/starrocks-cn-shared.conf ] && ! grep -q "LAKEHOUSE_TRACK_CN_CONF" /opt/starrocks/cn/conf/cn.conf 2>/dev/null; then
          {
            echo ""
            echo "# BEGIN LAKEHOUSE_TRACK_CN_CONF"
            cat /opt/starrocks-cn-shared.conf
            echo "# END LAKEHOUSE_TRACK_CN_CONF"
          } >> /opt/starrocks/cn/conf/cn.conf
        fi
        mkdir -p /opt/starrocks/cn/lib/paimon-ext /opt/starrocks/cn/datacache
        if [ -d /opt/starrocks-extra-jars ] && ls /opt/starrocks-extra-jars/*.jar 1>/dev/null 2>&1; then
          ln -sf /opt/starrocks-extra-jars/*.jar /opt/starrocks/cn/lib/paimon-ext/
        fi
        sleep 15
        mysql -h starrocks-fe -P9030 -uroot -e "SHOW COMPUTE NODES" | grep -q "$$CN_HOST" || \
        mysql -h starrocks-fe -P9030 -uroot -e "ALTER SYSTEM ADD COMPUTE NODE '$$CN_HOST:9050';"
        _term() {
          mysql -h starrocks-fe -P9030 -uroot \
            -e "ALTER SYSTEM DROP COMPUTE NODE '$$CN_HOST:9050';" 2>/dev/null || true
          kill -TERM "$$CN_PID" 2>/dev/null
          wait "$$CN_PID" 2>/dev/null
          exit 0
        }
        trap _term SIGTERM SIGINT
        /opt/starrocks/cn/bin/start_cn.sh &
        CN_PID=$$!
        wait $$CN_PID
    volumes:
      - ./services/starrocks/config/cn.conf:/opt/starrocks-cn-shared.conf:ro
      - ./services/starrocks/jars:/opt/starrocks-extra-jars:ro
    depends_on:
      starrocks-fe:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -hstarrocks-fe -P9030 -e 'SHOW COMPUTE NODES' | grep $$(hostname -f) | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    stop_grace_period: 30s
    restart: on-failure
    networks:
      - lakehouse-net

networks:
  lakehouse-net:
    name: lakehouse-net
    driver: bridge
