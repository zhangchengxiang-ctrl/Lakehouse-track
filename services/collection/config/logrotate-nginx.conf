# access_log 已按小时自动切分（access_YYYYMMDDHH.log），由 supervisord log-cleanup 清理
# 此处仅处理 error.log 的大小轮转
/var/log/nginx/error.log {
    size 100M
    rotate 3
    create 0644 root root
    missingok
    notifempty
    compress
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) 2>/dev/null || true
    endscript
}
