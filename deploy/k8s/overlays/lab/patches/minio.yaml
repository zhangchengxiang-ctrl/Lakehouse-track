apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: lakehouse-track
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: minio
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
