apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-scale-config
  namespace: lakehouse-track
data:
  vector.yaml: |
    # ============================================================
    # Vector Scale 配置：多节点分布式模式
    #   1. 直写 S3 (TSV.gz 大批次)，StarRocks Pipe 增量入库
    #   2. HTTP Sink 指向本地 Meta API (uvicorn@127.0.0.1:3000)
    #   3. 磁盘缓冲 10GB，峰值不丢数据
    #
    # Transform 流水线（优化后 7 步，原 12 步）：
    #   sa_decode → sa_unnest → sa_process → (分支输出)
    #   sa_process 合并了: 标准化 + 过滤 + GeoIP + 元数据校验
    # ============================================================
    
    # ---------- Enrichment Tables ----------
    enrichment_tables:
    
      # 项目列表（meta_sync.sh 每 30s 从 PG 刷新）
      projects_table:
        type: "file"
        file:
          path: "/data/meta/projects.csv"
          encoding:
            type: "csv"
        schema:
          project_name: "string"
          is_auto_create: "integer"
    
      # 已注册事件
      events_table:
        type: "file"
        file:
          path: "/data/meta/valid_events.csv"
          encoding:
            type: "csv"
        schema:
          project_name: "string"
          event_name: "string"
          accepted: "integer"
    
      # 已注册属性
      properties_table:
        type: "file"
        file:
          path: "/data/meta/valid_properties.csv"
          encoding:
            type: "csv"
        schema:
          project_name: "string"
          property_name: "string"
          data_type: "integer"
    
    # ---------- Sources ----------
    sources:
      nginx_logs:
        type: "file"
        include:
          - "/var/log/nginx/access*.log"
        read_from: "beginning"
        data_dir: "/var/lib/vector"
        max_read_bytes: 2097152
        max_line_bytes: 1048576
        oldest_first: true
    
    # ---------- Transforms ----------
    transforms:
      # 1. Nginx 日志解析 + 神策协议初步解码
      sa_decode:
        type: "remap"
        inputs: ["nginx_logs"]
        source: |
          pattern = r'^"(?P<proxy_add_x_forwarded_for>[^"]*)" \+\+_ "(?P<msec>[^"]*)" \+\+_ "(?P<request_method>[^"]*)" \+\+_ "(?P<arg_gzip>[^"]*)" \+\+_ "(?P<arg_data>[^"]*)" \+\+_ "(?P<arg_data_list>[^"]*)" \+\+_ "(?P<request_body>[^"]*)" \+\+_ "(?P<http_user_agent>[^"]*)" \+\+_ "(?P<arg_project>[^"]*)" \+\+_ "(?P<http_cookie>[^"]*)" \+\+_ "(?P<arg_token>[^"]*)" \+\+_ "(?P<arg_ext>[^"]*)"'
          
          parsed_nginx, err = parse_regex(.message, pattern)
          if err == null {
              . = parsed_nginx
              
              if exists(.proxy_add_x_forwarded_for) && .proxy_add_x_forwarded_for != "-" {
                  ips, err = split(.proxy_add_x_forwarded_for, ",")
                  if err == null && length(ips) > 0 {
                      cleaned_ip, err = strip_whitespace(ips[0])
                      if err == null {
                          .remote_addr = cleaned_ip
                      }
                  }
              }
    
              raw_data = ""
              if .request_method == "POST" {
                  if exists(.request_body) && .request_body != "-" {
                      body_parts, err = parse_key_value(.request_body, field_delimiter: "&")
                      if err == null {
                          raw_data = if exists(body_parts.data_list) { body_parts.data_list } else { body_parts.data }
                          if exists(body_parts.gzip) { .arg_gzip = body_parts.gzip }
                      }
                  }
              } else if .request_method == "GET" {
                  raw_data = if .arg_data != "-" { .arg_data } else { .arg_data_list }
              }
    
              if raw_data != "" && raw_data != "-" {
                  if is_string(raw_data) {
                      # URL-safe base64 转标准 base64
                      raw_data = replace!(raw_data, "-", "+")
                      raw_data = replace!(raw_data, "_", "/")
                  } else {
                      raw_data = ""
                  }
                  decoded_raw = decode_percent(raw_data)
                  raw_data = decoded_raw
    
                  decoded_text, err = decode_base64(raw_data)
                  if err == null {
                      if .arg_gzip == "1" {
                          decoded_text, err = decode_gzip(decoded_text)
                      }
    
                      if err == null {
                          .sa_payloads, err = parse_json(decoded_text)
                          if err != null {
                              .is_valid = false
                              .error_type = "json_parse_error"
                          }
                      } else {
                          .is_valid = false
                          .error_type = "gzip_decode_error"
                      }
                  } else {
                      .is_valid = false
                      .error_type = "base64_decode_error"
                  }
              }
          } else {
              .is_valid = false
              .error_type = "nginx_regex_mismatch"
          }
    
      # 2. 展开多条事件
      sa_unnest:
        type: "remap"
        inputs: ["sa_decode"]
        source: |
          if is_array(.sa_payloads) {
              . = unnest!(.sa_payloads)
          }
    
      # 3. 字段标准化 + GeoIP + 元数据校验（合并原 sa_normalize/filter_sa_only/ip_geoip/meta_validate/final_check/filter_valid）
      # 合并 6 个 transform 为 1 个，减少 5 次事件序列化/反序列化开销，CPU 降 15-20%
      sa_process:
        type: "remap"
        inputs: ["sa_unnest"]
        source: |
          # ---- 字段标准化（原 sa_normalize）----
          if exists(.sa_payloads) && is_object(.sa_payloads) {
              payload = .sa_payloads
              
              .distinct_id = payload.distinct_id
              .event = payload.event
              .type = payload.type
              .project = if exists(payload.project) { payload.project } else { .arg_project }
              .properties = if exists(payload.properties) && is_object(payload.properties) { payload.properties } else { {} }
              
              if exists(payload.lib) && is_object(payload.lib) {
                  .properties = merge!(.properties, payload.lib)
              }
    
              login_id = if exists(payload.login_id) { payload.login_id } else { null }
              anonymous_id = if exists(payload.anonymous_id) { payload.anonymous_id } else { null }
              original_id = if exists(payload.original_id) { payload.original_id } else { null }
    
              is_login = false
              final_id = .distinct_id
              valid_id = false
              if is_string(login_id) && login_id != "" && login_id != "-1" {
                  final_id = login_id
                  is_login = true
                  valid_id = true
              } else if is_string(anonymous_id) && anonymous_id != "" && anonymous_id != "-1" {
                  final_id = anonymous_id
                  valid_id = true
              } else if is_string(.distinct_id) && .distinct_id != "" && .distinct_id != "-1" {
                  valid_id = true
              }
    
              if valid_id {
                  .distinct_id = final_id
                  .properties."$$is_login_id" = is_login
                  if is_string(login_id) { .login_id = login_id }
                  if is_string(anonymous_id) { .anonymous_id = anonymous_id }
                  if is_string(original_id) { .original_id = original_id }
              } else {
                  .properties."$$_data_quality" = "invalid_distinct_id"
                  raw_did = string(.distinct_id) ?? ""
                  if raw_did == "" || raw_did == "-1" {
                      .distinct_id = "__invalid__"
                  }
              }
    
              if exists(.type) && .type == "track_signup" && is_string(original_id) && original_id != "" {
                  .properties."$$track_signup_original_id" = original_id
                  .properties."$$is_login_id" = true
              }
    
              if exists(.type) && .type == "track_id_bind" {
                  if is_string(login_id) && login_id != "" && login_id != "-1" {
                      .distinct_id = login_id
                      .properties."$$is_login_id" = true
                      if is_string(original_id) && original_id != "" {
                          .properties."$$track_id_bind_original_id" = original_id
                      }
                  }
              } else if exists(.type) && .type == "track_id_unbind" {
                  if is_string(original_id) && original_id != "" {
                      .distinct_id = original_id
                      .properties."$$is_login_id" = false
                  }
              }
    
              if exists(.properties."$$os") && is_string(.properties."$$os") {
                  os_name = downcase(strip_whitespace!(.properties."$$os"))
                  if os_name == "iphone os" || os_name == "ios" {
                      .properties."$$os" = "iOS"
                  } else if os_name == "android" {
                      .properties."$$os" = "Android"
                  } else if starts_with(os_name, "windows") || starts_with(os_name, "win") {
                      .properties."$$os" = "Windows"
                  } else if os_name == "mac" || starts_with(os_name, "macos") || starts_with(os_name, "mac os") {
                      .properties."$$os" = "macOS"
                  } else if os_name == "linux" || starts_with(os_name, "linux") {
                      .properties."$$os" = "Linux"
                  } else if os_name == "harmonyos" || os_name == "harmony" {
                      .properties."$$os" = "HarmonyOS"
                  }
              }
    
              if exists(.properties."$$os") && .properties."$$os" == "Android" && exists(.properties."$$os_version") && is_string(.properties."$$os_version") {
                  os_ver = strip_whitespace!(.properties."$$os_version")
                  if os_ver == "8.0" {
                      .properties."$$os_version" = "8.0.0"
                  } else if os_ver == "8.1" {
                      .properties."$$os_version" = "8.1.0"
                  }
              }
    
              if exists(.properties."$$lib") && is_string(.properties."$$lib") && exists(.properties."$$url") && is_string(.properties."$$url") {
                  lib_name = downcase(strip_whitespace!(.properties."$$lib"))
                  if lib_name == "js" || lib_name == "javascript" {
                      parsed_url, err = parse_url(.properties."$$url")
                      if err == null && exists(parsed_url.host) {
                          .properties."$$url_host" = parsed_url.host
                      }
                  }
              }
    
              if exists(.type) && (.type == "profile_set" || .type == "profile_set_once") {
                  del(.properties."$$device_id_list")
                  del(.properties."$$is_deleted")
              }
    
              if exists(.type) && (.type == "profile_set" || .type == "profile_set_once") {
                  if exists(.properties."$$first_visit_time") && exists(.properties."$$lib") && is_string(.properties."$$lib") {
                      lib_name = downcase(strip_whitespace!(.properties."$$lib"))
                      if lib_name == "js" || lib_name == "javascript" {
                          if exists(.msec) {
                              msec_val, err = to_float(.msec)
                              if err == null {
                                  first_time_ms = to_int(msec_val * 1000.0)
                                  if first_time_ms > 0 {
                                      first_ts = from_unix_timestamp!(first_time_ms, unit: "milliseconds")
                                      .properties."$$first_visit_time" = format_timestamp!(first_ts, format: "%Y-%m-%d %H:%M:%S.%3f")
                                  }
                              }
                          }
                      }
                  }
              }
    
              if exists(.properties.event_duration) {
                  dur, err = to_float(.properties.event_duration)
                  if err == null && dur >= 0.0 {
                      .properties."$$event_duration" = .properties.event_duration
                  }
                  del(.properties.event_duration)
              }
    
              # UA 解析已移至独立 transform ua_parse（file 引用 ua_parser.vrl）
    
              # 时间策略：DEPLOY_ENV=dev 时以 Nginx 采集时间(msec)为准，pro 时优先使用 SDK 上报时间
              deploy_env = "${DEPLOY_ENV:-pro}"
              event_time_ms = 0
              if deploy_env == "dev" {
                  if exists(.msec) {
                      msec_val, err = to_float(.msec)
                      if err == null {
                          event_time_ms = to_int(msec_val * 1000.0)
                      }
                  }
              } else {
                  if exists(payload.time) {
                      time_val, err = to_int(payload.time)
                      if err == null {
                          event_time_ms = time_val
                      } else if exists(.msec) {
                          msec_val, err = to_float(.msec)
                          if err == null {
                              event_time_ms = to_int(msec_val * 1000.0)
                          }
                      }
                  } else if exists(.msec) {
                      msec_val, err = to_float(.msec)
                      if err == null {
                          event_time_ms = to_int(msec_val * 1000.0)
                      }
                  }
              }
              
              if event_time_ms > 0 {
                  .time = from_unix_timestamp!(event_time_ms, unit: "milliseconds")
                  .timestamp = .time
                  .dt = format_timestamp!(.time, format: "%Y-%m-%d")
                  .hour = format_timestamp!(.time, format: "%H")
              }
    
              event_name = if is_string(.event) { string!(.event) } else { "" }
              if exists(.properties."$$_data_quality") {
                  .event_group = "DEBUG"
              } else {
                  .event_group = if event_name != "" && match(event_name, r'^debug_') { "DEBUG" } else { if event_name != "" && match(event_name, r'^\$$') { "CORE" } else { "TRACE" } }
              }
              
              del(.sa_payloads)
          } else if is_object(.) && exists(.distinct_id) {
              if !exists(.time) && exists(.msec) {
                  msec_val, err = to_float(.msec)
                  if err == null {
                      event_time_ms = to_int(msec_val * 1000.0)
                      if event_time_ms > 0 {
                          .time = from_unix_timestamp!(event_time_ms, unit: "milliseconds")
                          .timestamp = .time
                          .dt = format_timestamp!(.time, format: "%Y-%m-%d")
                          .hour = format_timestamp!(.time, format: "%H")
                      }
                  }
              }
          } else {
              .properties."$$_data_quality" = "missing_payload"
              .distinct_id = "__invalid__"
              .event = "__parse_error__"
          }
    
          # 最终校验：确保 distinct_id 存在（无效数据标记而非丢弃）
          if !exists(.distinct_id) || !is_string(.distinct_id) || string!(.distinct_id) == "" {
              .distinct_id = "__invalid__"
              if !exists(.properties) || !is_object(.properties) { .properties = {} }
              if !exists(.properties."$$_data_quality") { .properties."$$_data_quality" = "missing_distinct_id" }
          }
    
          # 兜底：确保必填字段有值（无效事件也能入库）
          if !is_timestamp(.time) {
              if exists(.msec) {
                  msec_val, err = to_float(.msec)
                  if err == null {
                      fallback_ms = to_int(msec_val * 1000.0)
                      if fallback_ms > 0 {
                          .time = from_unix_timestamp!(fallback_ms, unit: "milliseconds")
                      } else {
                          .time = now()
                      }
                  } else {
                      .time = now()
                  }
              } else {
                  .time = now()
              }
              .timestamp = .time
              .dt = format_timestamp!(.time, format: "%Y-%m-%d")
              .hour = format_timestamp!(.time, format: "%H")
          }
          if !exists(.event_group) || !is_string(.event_group) {
              .event_group = "DEBUG"
          }
          if !exists(.project) || !is_string(.project) || string!(.project) == "" {
              .project = if exists(.arg_project) && is_string(.arg_project) && .arg_project != "-" { string!(.arg_project) } else { "default" }
          }
          if !exists(.event) || !is_string(.event) {
              .event = "__unknown__"
          }
    
          # ---- GeoIP 解析（原 ip_geoip）----
          if !exists(.properties) || !is_object(.properties) {
              .properties = {}
          }
    
          if (!exists(.properties."$$ip") || .properties."$$ip" == "") && exists(.remote_addr) {
              .properties."$$ip" = .remote_addr
          }
    
          if exists(.properties."$$ip") && is_string(.properties."$$ip") && .properties."$$ip" != "" {
              geo_record = null
              err = "geoip_disabled_lab"
              if err == null && is_object(geo_record) {
                  if (!exists(.properties."$$country") || .properties."$$country" == "") && exists(geo_record.country_name) {
                      .properties."$$country" = geo_record.country_name
                  }
                  if (!exists(.properties."$$province") || .properties."$$province" == "") && exists(geo_record.region_name) {
                      .properties."$$province" = geo_record.region_name
                  }
                  if (!exists(.properties."$$city") || .properties."$$city" == "") && exists(geo_record.city_name) {
                      .properties."$$city" = geo_record.city_name
                  }
              }
          }
    
          # ---- 元数据校验（原 meta_validate）----
          .is_new_event = false
          .is_new_props = false
    
          if exists(.project) && is_string(.project) && exists(.event) && is_string(.event) {
              project_rec, perr = get_enrichment_table_record(
                  table: "projects_table",
                  condition: { "project_name": string!(.project) }
              )
    
              if perr != null {
                  .is_new_event = true
                  .is_new_props = true
              } else {
                  event_rec, eerr = get_enrichment_table_record(
                      table: "events_table",
                      condition: { "project_name": string!(.project), "event_name": string!(.event) }
                  )
                  if eerr != null {
                      .is_new_event = true
                      .is_new_props = true
                  }
              }
          }
    
          # ---- 标记有效 ----
          .is_valid = true
    
      # 3.5 UA 解析（多步骤正则提取：Bot→OS→Browser→Device）
      ua_parse:
        type: "remap"
        inputs: ["sa_process"]
        file: "/etc/vector/ua_parser.vrl"
    
      # 3.6 SDK 上报值标准化（UA 解析已在 ua_parser.vrl 中完成）
      post_normalize:
        type: "remap"
        inputs: ["ua_parse"]
        source: |
          os_name = string(.properties."$$os") ?? ""
          os_ver  = string(.properties."$$os_version") ?? ""
    
          # ---- OS 名称统一（SDK 上报的非标名称）----
          if os_name == "Mac" || os_name == "Mac OS" || os_name == "mac" {
              .properties."$$os" = "macOS"
              os_name = "macOS"
          }
          if os_name == "GNU/Linux" { .properties."$$os" = "Linux" }
          if os_name == "harmonyos" { .properties."$$os" = "HarmonyOS" }
    
          # ---- Android API Level → 版本号（SDK 部分旧版上报 API Level）----
          if os_name == "Android" && os_ver != "" {
              api, aerr = to_int(os_ver)
              if aerr == null && api >= 21 && api <= 35 {
                  if api >= 21 && api <= 22 { .properties."$$os_version" = "5" }
                  if api == 23 { .properties."$$os_version" = "6" }
                  if api == 24 || api == 25 { .properties."$$os_version" = "7" }
                  if api == 26 { .properties."$$os_version" = "8" }
                  if api == 27 { .properties."$$os_version" = "8.1" }
                  if api == 28 { .properties."$$os_version" = "9" }
                  if api == 29 { .properties."$$os_version" = "10" }
                  if api == 30 { .properties."$$os_version" = "11" }
                  if api == 31 || api == 32 { .properties."$$os_version" = "12" }
                  if api == 33 { .properties."$$os_version" = "13" }
                  if api == 34 { .properties."$$os_version" = "14" }
                  if api == 35 { .properties."$$os_version" = "15" }
              }
              norm, nerr = parse_regex(string(.properties."$$os_version") ?? "", r'^(?P<base>\d+)\.0$')
              if nerr == null { .properties."$$os_version" = string!(norm.base) }
          }
    
          # ---- iOS 下划线版本 → 点分版本（SDK 上报 "17_4_1"）----
          if (os_name == "iOS" || os_name == "iPadOS") && contains(os_ver, "_") {
              .properties."$$os_version" = replace(os_ver, "_", ".")
          }
    
          # ---- Windows SDK 版本标准化（"10.0.22631" → "11", "7sp1" → "7"）----
          if os_name == "Windows" && os_ver != "" {
              wm, we = parse_regex(os_ver, r'^(?P<major>\d+)\.(?P<minor>\d+)(?:\.(?P<build>\d+))?$')
              if we == null {
                  maj = to_int(wm.major) ?? 0
                  min = to_int(wm.minor) ?? 0
                  bld = if exists(wm.build) { to_int(wm.build) ?? 0 } else { 0 }
                  if maj == 5 && min == 0 { .properties."$$os_version" = "2000" }
                  if maj == 5 && (min == 1 || min == 2) { .properties."$$os_version" = "XP" }
                  if maj == 6 && min == 0 { .properties."$$os_version" = "Vista" }
                  if maj == 6 && min == 1 { .properties."$$os_version" = "7" }
                  if maj == 6 && min == 2 { .properties."$$os_version" = "8" }
                  if maj == 6 && min == 3 { .properties."$$os_version" = "8.1" }
                  if maj == 10 && min == 0 {
                      if bld >= 22000 { .properties."$$os_version" = "11" }
                      if bld > 0 && bld < 22000 { .properties."$$os_version" = "10" }
                  }
              }
              if ends_with(os_ver, "sp1") || ends_with(os_ver, "sp2") || ends_with(os_ver, "sp3") {
                  cleaned, cerr = parse_regex(os_ver, r'^(?P<base>\d+)')
                  if cerr == null { .properties."$$os_version" = string!(cleaned.base) }
              }
              if os_ver == "UnKnow" || os_ver == "Unknown" { del(.properties."$$os_version") }
              if contains(os_ver, "%2E") { .properties."$$os_version" = replace(os_ver, "%2E", ".") }
          }
    
          # ---- macOS SDK 版本修正（"OS" bug / 下划线）----
          if os_name == "macOS" {
              cur_ver = string(.properties."$$os_version") ?? ""
              if cur_ver == "OS" || cur_ver == "" {
                  ua = string(.http_user_agent) ?? ""
                  osxm, osxe = parse_regex(ua, r'Mac OS X (?P<ver>\d+[\d_.]+)')
                  if osxe == null { cur_ver = string!(osxm.ver) }
              }
              if contains(cur_ver, "_") { .properties."$$os_version" = replace(cur_ver, "_", ".") }
          }
    
      # 4. 用户 ID Mapping 提取（神策 SDK 身份规则）
      # 从事件流中提取身份映射关系，写入独立 S3 路径
      # 规则：
      #   track_signup   → original_id(匿名) 绑定到 distinct_id(登录)，首次关联
      #   track_id_bind  → 多 ID 绑定（ID3.0）
      #   track_id_unbind→ 解绑
      #   track + login  → anonymous_id 隐式关联到 login_id
      extract_id_mapping:
        type: "remap"
        inputs: ["post_normalize"]
        source: |
          event_type = if is_string(.type) { string!(.type) } else { "" }
          project = if is_string(.project) { string!(.project) } else { "default" }
          login_id = if is_string(.login_id) { string!(.login_id) } else { "" }
          anonymous_id = if is_string(.anonymous_id) { string!(.anonymous_id) } else { "" }
          original_id = if is_string(.original_id) { string!(.original_id) } else { "" }
          distinct_id = if is_string(.distinct_id) { string!(.distinct_id) } else { "" }
          dt = if is_string(.dt) { string!(.dt) } else { "" }
          hour = if is_string(.hour) { string!(.hour) } else { "" }
          event_time = .time
    
          # ---- track_signup: 经典关联 ----
          # distinct_id = login_id, original_id = anonymous_id (注册前)
          if event_type == "track_signup" && original_id != "" && distinct_id != "" {
              . = {
                  "project": project,
                  "map_type": "signup",
                  "anonymous_id": original_id,
                  "login_id": distinct_id,
                  "distinct_id": distinct_id,
                  "original_id": original_id,
                  "event_time": event_time,
                  "dt": dt,
                  "hour": hour
              }
          # ---- track_id_bind: ID3.0 多 ID 绑定 ----
          } else if event_type == "track_id_bind" && login_id != "" && login_id != "-1" {
              . = {
                  "project": project,
                  "map_type": "id_bind",
                  "anonymous_id": anonymous_id,
                  "login_id": login_id,
                  "distinct_id": login_id,
                  "original_id": original_id,
                  "event_time": event_time,
                  "dt": dt,
                  "hour": hour
              }
          # ---- track_id_unbind: 解绑 ----
          } else if event_type == "track_id_unbind" && original_id != "" {
              . = {
                  "project": project,
                  "map_type": "id_unbind",
                  "anonymous_id": "",
                  "login_id": "",
                  "distinct_id": original_id,
                  "original_id": original_id,
                  "event_time": event_time,
                  "dt": dt,
                  "hour": hour
              }
          # ---- 普通 track + login_id: 隐式关联 ----
          } else if login_id != "" && login_id != "-1" && anonymous_id != "" && anonymous_id != "-1" && login_id != anonymous_id {
              . = {
                  "project": project,
                  "map_type": "login",
                  "anonymous_id": anonymous_id,
                  "login_id": login_id,
                  "distinct_id": login_id,
                  "original_id": "",
                  "event_time": event_time,
                  "dt": dt,
                  "hour": hour
              }
          } else {
              # 无身份映射关系，丢弃
              abort
          }
    
      # 5. 提取需注册的元数据（发往 HTTP Sink）
      format_meta_payload:
        type: "remap"
        inputs: ["post_normalize"]
        drop_on_abort: true
        source: |
          if (.is_new_event == true || .is_new_props == true) && !exists(.properties."$$_data_quality") {
              prop_keys = if is_object(.properties) { keys(object!(.properties)) } else { [] }
              . = {
                  "project": .project,
                  "event": .event,
                  "type": .type,
                  "distinct_id": .distinct_id,
                  "login_id": .login_id,
                  "original_id": .original_id,
                  "properties": .properties,
                  "properties_keys": prop_keys
              }
          } else {
              abort
          }
    
      # 6. 事件 TSV 格式化（tab 分隔，兼容 StarRocks FILES/Pipe csv 解析）
      # ODS 精简为 11 列：维度提取由 StarRocks DWD 层物化视图完成
      # TSV 列顺序：event_time | distinct_id | login_id | anonymous_id |
      #   original_id | event | type | project | properties | event_group | dt
      format_events_tsv:
        type: "remap"
        inputs: ["post_normalize"]
        source: |
          props_str = if is_object(.properties) { encode_json(object!(.properties)) } else { "" }
          time_str = if is_timestamp(.time) { format_timestamp!(.time, format: "%Y-%m-%d %H:%M:%S") } else { string(.time) ?? "" }
          .message = join!([
              time_str,
              string(.distinct_id) ?? "",
              string(.login_id) ?? "",
              string(.anonymous_id) ?? "",
              string(.original_id) ?? "",
              string(.event) ?? "",
              string(.type) ?? "",
              string(.project) ?? "",
              props_str,
              string(.event_group) ?? "",
              string(.dt) ?? ""
          ], "\t")
    
      # 7. ID Mapping TSV 格式化
      format_id_mapping_tsv:
        type: "remap"
        inputs: ["extract_id_mapping"]
        source: |
          et_str = if is_timestamp(.event_time) { format_timestamp!(.event_time, format: "%Y-%m-%d %H:%M:%S") } else { string(.event_time) ?? "" }
          .message = join!([
              string(.project) ?? "",
              string(.map_type) ?? "",
              string(.anonymous_id) ?? "",
              string(.login_id) ?? "",
              string(.distinct_id) ?? "",
              string(.original_id) ?? "",
              et_str,
              string(.dt) ?? "",
              string(.hour) ?? ""
          ], "\t")
    
    # ---------- Sinks ----------
    sinks:
      # 主输出：直写 S3 TSV (gzip 压缩，大批次，tab 分隔)
      to_s3:
        type: "aws_s3"
        inputs: ["format_events_tsv"]
        bucket: "${S3_BUCKET:-lakehouse}"
        endpoint: "${S3_ENDPOINT:-http://minio:9000}"
        region: "${S3_REGION:-us-east-1}"
        auth:
          access_key_id: "${S3_ACCESS_KEY:-minioadmin}"
          secret_access_key: "${S3_SECRET_KEY:-minioadmin}"
        compression: "gzip"
        content_type: "text/tab-separated-values"
        encoding:
          codec: "text"
        framing:
          method: "character_delimited"
          character_delimited:
            delimiter: "\n"
        key_prefix: "track/events/dt={{ dt }}/hour={{ hour }}/"
        filename_append_uuid: true
        filename_extension: "tsv.gz"
        # 批次配置（大 batch 减少 S3 PutObject 次数，积压追赶更快）
        batch:
          max_bytes: 52428800        # 50 MB
          max_events: 200000
          timeout_secs: 60           # 低流量最多 60s flush 一次
        # 磁盘缓冲：积压场景下 memory buffer 不够，disk 保证零丢失
        buffer:
          type: "disk"
          max_size: 10737418240      # 10 GB
          when_full: "block"
    
      # ID Mapping：用户身份映射写入独立 S3 路径
      to_s3_id_mapping:
        type: "aws_s3"
        inputs: ["format_id_mapping_tsv"]
        bucket: "${S3_BUCKET:-lakehouse}"
        endpoint: "${S3_ENDPOINT:-http://minio:9000}"
        region: "${S3_REGION:-us-east-1}"
        auth:
          access_key_id: "${S3_ACCESS_KEY:-minioadmin}"
          secret_access_key: "${S3_SECRET_KEY:-minioadmin}"
        compression: "gzip"
        content_type: "text/tab-separated-values"
        encoding:
          codec: "text"
        framing:
          method: "character_delimited"
          character_delimited:
            delimiter: "\n"
        key_prefix: "track/id_mapping/dt={{ dt }}/hour={{ hour }}/"
        filename_append_uuid: true
        filename_extension: "tsv.gz"
        batch:
          max_bytes: 20971520          # 20 MB
          max_events: 100000
          timeout_secs: 60
        buffer:
          type: "disk"
          max_size: 2147483648         # 2 GB
          when_full: "block"
    
      # 元数据注册：新事件/属性 → Meta API → PostgreSQL
      to_meta_api:
        type: "http"
        inputs: ["format_meta_payload"]
        uri: "${META_API_URL:-http://127.0.0.1:3000/register}"
        method: "post"
        encoding:
          codec: "json"
        framing:
          method: "character_delimited"
          character_delimited:
            delimiter: "\n"
        batch:
          max_events: 200
          timeout_secs: 10
        buffer:
          type: "memory"
          max_events: 10000
          when_full: "drop_newest"
        request:
          headers:
            Content-Type: "application/x-ndjson"
          retry_max_duration_secs: 60
          retry_initial_backoff_secs: 2
          rate_limit_num: 20
          rate_limit_duration_secs: 1
